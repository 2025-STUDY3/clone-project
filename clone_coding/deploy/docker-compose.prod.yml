services:
  everytime-mysql:
    image: mysql:8.0.43
    container_name: everytime-mysql
    env_file:
      - .env.prod
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./_vol/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: leeym1/everytime:latest
    container_name: everytime-app
    env_file:
      - .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      everytime-mysql:
        condition: service_healthy        # ← DB 살아있을 때만 앱 시작
    ports:
      - "80:8080"                         # Spring이 8080에서 뜬다는 가정
    restart: unless-stopped
